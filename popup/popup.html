<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document & PDF Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="icon-wrap">⚡</div>
      <div class="header-text">
        <h3>Document & PDF Pro</h3>
        <span>Sách Scan & In PDF Sạch</span>
      </div>
    </div>
    
    <div class="info-card">
      <p>Hỗ trợ 2 chế độ: <strong>📖 Tải sách Flipbook (ZIP/PDF)</strong> và <strong>📄 In & Tải PDF Sạch (PrintFriendly)</strong> đa khổ giấy A3/A4/Letter & xoay ngang/dọc.</p>
    </div>

    <div id="statusMessage" class="status-msg" style="display: none;"></div>

    <button id="openPanelBtn" class="btn-launch">
      <span>🚀 Mở Bảng Điều Khiển</span>
    </button>

    <div class="footer">
      <span>Phiên bản 2.5.0 • Dual-Mode & In-Tab Isolation</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
