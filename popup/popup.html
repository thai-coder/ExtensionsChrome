<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="icon-wrap">📖</div>
      <div class="header-text">
        <h3>Flipbook Downloader</h3>
        <span>Trích xuất tài liệu & Sách Pro</span>
      </div>
    </div>
    
    <div class="info-card">
      <p>Nhấn nút bên dưới hoặc phím tắt <kbd>Alt + D</kbd> trên trang web đọc sách để mở bảng điều khiển tải tự động.</p>
    </div>

    <div id="statusMessage" class="status-msg" style="display: none;"></div>

    <button id="openPanelBtn" class="btn-launch">
      <span>🚀 Mở Bảng Điều Khiển</span>
    </button>

    <div class="footer">
      <span>Phiên bản 2.0.0 • Anti-Block & Auto-Patch</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
